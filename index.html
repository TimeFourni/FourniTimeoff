<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FourniTime | Vêtements & Accessoires</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0a0b10;
            --bg-card: rgba(20, 24, 35, 0.75);
            --neon-cyan: #00f0ff;
            --neon-purple: #bd00ff;
            --text-main: #e2e8f0;
            --text-muted: #8a99ad;
            --border-glow: rgba(0, 240, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(189, 0, 255, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 240, 255, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
        }

        header {
            padding: 1.2rem 1rem;
            text-align: center;
            background: rgba(10, 11, 16, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .admin-trigger {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .container {
            padding: 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Banner telegram */
        .telegram-banner {
            background: linear-gradient(90deg, rgba(0, 136, 204, 0.2), rgba(0, 240, 255, 0.1));
            border: 1px solid #0088cc;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .telegram-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }

        .telegram-btn {
            background: #0088cc;
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
        }

        /* Categories Bar */
        .categories-bar {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            scrollbar-width: none;
        }
        .categories-bar::-webkit-scrollbar { display: none; }

        .cat-chip {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            white-space: nowrap;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-chip.active {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        /* Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-image-container {
            width: 100%;
            height: 130px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.8rem;
            overflow: hidden;
        }

        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-emoji {
            font-size: 3.5rem;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            line-height: 1.2;
        }

        .product-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            gap: 5px;
        }

        .product-price {
            font-size: 1.05rem;
            font-weight: 800;
            color: white;
        }

        .buy-btn {
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple));
            border: none;
            color: var(--bg-dark);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Float Cart */
        .cart-bar {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 2rem);
            max-width: 600px;
            background: rgba(20, 24, 35, 0.9);
            border: 1px solid var(--neon-cyan);
            border-radius: 30px;
            padding: 0.8rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 20px rgba(0,240,255,0.2);
            z-index: 100;
            cursor: pointer;
        }

        .cart-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .cart-count {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 800;
        }

        .cart-checkout-btn {
            background: var(--neon-purple);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-content {
            background: var(--bg-dark);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.2rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.6rem;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
        }

        .btn-submit {
            width: 100%;
            background: var(--neon-cyan);
            color: var(--bg-dark);
            border: none;
            padding: 0.8rem;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Cart Details Items */
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .cart-item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .cart-item-title {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .cart-item-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .admin-actions {
            position: absolute;
            top: 5px;
            right: 5px;
            display: flex;
            gap: 4px;
            z-index: 5;
        }

        .admin-btn {
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .admin-btn.delete { color: #ff4757; }
        .admin-btn.draft { color: #ffa502; }

        .draft-card {
            opacity: 0.6;
            border-style: dashed;
        }

        .draft-badge {
            position: absolute;
            top: 5px;
            left: 5px;
            background: #ffa502;
            color: black;
            font-size: 0.6rem;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">FourniTime</div>
        <div class="header-actions">
            <button class="admin-trigger" id="admin-toggle-btn" onclick="toggleAdminView()">⚙️ Admin</button>
        </div>
    </header>

    <div class="container">
        <!-- Telegram Link Banner -->
        <div class="telegram-banner">
            <div class="telegram-info">
                <span style="font-size: 1.5rem;">✈️</span>
                <div>
                    <strong>Canal Telegram Officiel</strong>
                    <div style="font-size: 0.75rem; color: var(--text-muted);">Inscrivez-vous pour les nouveautés</div>
                </div>
            </div>
            <a href="https://t.me/ton_canal" target="_blank" class="telegram-btn">Rejoindre</a>
        </div>

        <!-- Categories Filter -->
        <div class="categories-bar" id="categories-container">
            <!-- Dynamique -->
        </div>

        <!-- Admin Add Button (masqué par défaut) -->
        <div id="admin-controls" style="display: none; margin-bottom: 1rem; gap: 10px;">
            <button class="buy-btn" onclick="openModal('add-modal')">➕ Ajouter un Produit</button>
            <button class="buy-btn" style="background: var(--neon-purple); color: white;" onclick="openModal('cat-modal')">📁 Gérer Catégories</button>
        </div>

        <!-- Product Grid -->
        <div class="product-grid" id="product-grid">
            <!-- Injecté par JS -->
        </div>
    </div>

    <!-- Floating Cart Bar -->
    <div class="cart-bar" id="cart-bar" onclick="openModal('cart-modal')" style="display: none;">
        <div class="cart-info">
            <div class="cart-count" id="cart-count">0</div>
            <span>Mon Panier</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span id="cart-total" style="font-weight: 800;">0.00 €</span>
            <div class="cart-checkout-btn">Commander</div>
        </div>
    </div>

    <!-- Modal Panier -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Votre Panier</h3>
                <button class="close-btn" onclick="closeModal('cart-modal')">&times;</button>
            </div>
            <div id="cart-items-container">
                <!-- Contenu panier -->
            </div>
            <div style="margin-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">
                <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 1.1rem; margin-bottom: 1rem;">
                    <span>Total:</span>
                    <span id="modal-cart-total" style="color: var(--neon-cyan);">0.00 €</span>
                </div>
                <div class="form-group">
                    <label>Nom / Pseudo Telegram</label>
                    <input type="text" id="cust-name" placeholder="@votre_pseudo">
                </div>
                <div class="form-group">
                    <label>Adresse de livraison / Notes</label>
                    <textarea id="cust-address" rows="2" placeholder="Ville, Code postal..."></textarea>
                </div>
                <button class="btn-submit" onclick="sendOrderTelegram()">Envoyer la Commande via Telegram</button>
            </div>
        </div>
    </div>

    <!-- Modal Ajouter Produit -->
    <div class="modal" id="add-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Ajouter un Produit</h3>
                <button class="close-btn" onclick="closeModal('add-modal')">&times;</button>
            </div>
            <form id="add-product-form" onsubmit="handleAddProduct(event)">
                <div class="form-group">
                    <label>Nom du Produit</label>
                    <input type="text" id="new-title" required>
                </div>
                <div class="form-group">
                    <label>Prix (€)</label>
                    <input type="number" step="0.01" id="new-price" required>
                </div>
                <div class="form-group">
                    <label>Catégorie</label>
                    <select id="new-category" required></select>
                </div>
                <div class="form-group">
                    <label>Type de Tailles</label>
                    <select id="new-size-type">
                        <option value="unique">Taille unique</option>
                        <option value="xs_xl">S au XL</option>
                        <option value="num_36_46">Du 36 au 45</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Visuel (Emoji OU URL de l'image)</label>
                    <input type="text" id="new-emoji" placeholder="Emoji (ex: 👕) ou https://image.png">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="new-desc" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Brouillon ?</label>
                    <select id="new-draft">
                        <option value="false">Non (Publier immédiatement)</option>
                        <option value="true">Oui (Masquer du catalogue)</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Créer le Produit</button>
            </form>
        </div>
    </div>

    <!-- Modal Éditer Produit -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Éditer le Produit</h3>
                <button class="close-btn" onclick="closeModal('edit-modal')">&times;</button>
            </div>
            <form id="edit-product-form" onsubmit="handleEditProduct(event)">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label>Nom du Produit</label>
                    <input type="text" id="edit-title" required>
                </div>
                <div class="form-group">
                    <label>Prix (€)</label>
                    <input type="number" step="0.01" id="edit-price" required>
                </div>
                <div class="form-group">
                    <label>Catégorie</label>
                    <select id="edit-category" required></select>
                </div>
                <div class="form-group">
                    <label>Type de Tailles</label>
                    <select id="edit-size-type">
                        <option value="unique">Taille unique</option>
                        <option value="xs_xl">S au XL</option>
                        <option value="num_36_46">Du 36 au 45</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Visuel (Emoji OU URL de l'image)</label>
                    <input type="text" id="edit-emoji" placeholder="Emoji ou URL image">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="edit-desc" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Brouillon ?</label>
                    <select id="edit-draft">
                        <option value="false">Non (Publier)</option>
                        <option value="true">Oui (Brouillon)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Suggestions associées</label>
                    <div id="edit-suggestions-list" style="max-height: 120px; overflow-y: auto; background: rgba(255,255,255,0.05); padding: 0.5rem; border-radius: 6px;"></div>
                </div>
                <button type="submit" class="btn-submit">Sauvegarder</button>
            </form>
        </div>
    </div>

    <!-- Modal Gestion Catégories -->
    <div class="modal" id="cat-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Gérer les Catégories</h3>
                <button class="close-btn" onclick="closeModal('cat-modal')">&times;</button>
            </div>
            <div class="form-group">
                <label>Nouvelle Catégorie (Nom)</label>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="new-cat-label" placeholder="ex: Accessoires">
                    <button class="buy-btn" onclick="addCategory()">Ajouter</button>
                </div>
            </div>
            <div id="cat-list-manage" style="margin-top: 1rem;">
                <!-- Liste des catégories avec bouton supprimer -->
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION SUPABASE
        const SUPABASE_URL = "https://mcntqbyrmsplfljwwzqj.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jbnRxYnlybXNwbGZsand3enFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTk4MzEsImV4cCI6MjEwMDM5NTgzMX0.5H6oNINjcIFuqRvNv5II0Pj8jJecMM4QnLVoV8sDWBw";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // CONFIGURATION TELEGRAM
        const TELEGRAM_USERNAME = "ton_username";

        // DONNÉES PAR DÉFAUT SI SUPABASE INDISPONIBLE
        const defaultCategories = [
            { id: 'all', label: 'Tous' },
            { id: 'vetements', label: 'Vêtements' },
            { id: 'chaussures', label: 'Chaussures' },
            { id: 'saccoches', label: 'Saccoches' },
            { id: 'casquettes', label: 'Casquettes' },
            { id: 'maillots-de-foot', label: 'Maillots de Foot' }
        ];

        const defaultProducts = [
            { id: "1", name: "Survêtement Tech", price: 45.00, category: "vetements", sizeType: "xs_xl", emoji: "👕", desc: "Ensemble complet coupe moderne.", draft: false },
            { id: "2", name: "Sneakers Runner", price: 75.00, category: "chaussures", sizeType: "num_36_46", emoji: "👟", desc: "Confort extrême et style néon.", draft: false },
            { id: "3", name: "Sacoche Street", price: 30.00, category: "saccoches", sizeType: "unique", emoji: "👜", desc: "Pratique et résistante.", draft: false },
            { id: "4", name: "Casquette Curve", price: 20.00, category: "casquettes", sizeType: "unique", emoji: "🧢", desc: "Taille unique réajustable.", draft: false },
            { id: "5", name: "Maillot Retro", price: 35.00, category: "maillots-de-foot", sizeType: "xs_xl", emoji: "⚽", desc: "Édition limitée.", draft: false }
        ];

        // ÉTAT DE L'APPLICATION
        let categories = [];
        let products = [];
        let cart = [];
        let activeCategory = 'all';
        let isAdmin = false;

        // INITIALISATION
        async function init() {
            await loadCategories();
            await loadProducts();
            loadCart();
            renderCategories();
            renderProducts();
            updateCartUI();
        }

        async function loadCategories() {
            try {
                const { data, error } = await supabaseClient.from('categories').select('*');
                if (error) throw error;
                if (data && data.length > 0) {
                    categories = [{ id: 'all', label: 'Tous' }, ...data];
                } else {
                    categories = defaultCategories;
                }
            } catch (err) {
                console.warn("Erreur chargement catégories Supabase, utilisation du fallback:", err);
                const local = localStorage.getItem('fourni_market_categories');
                categories = local ? JSON.parse(local) : defaultCategories;
            }
        }

        async function loadProducts() {
            try {
                const { data, error } = await supabaseClient.from('products').select('*');
                if (error) throw error;
                if (data && data.length > 0) {
                    products = data;
                } else {
                    products = defaultProducts;
                }
            } catch (err) {
                console.warn("Erreur chargement produits Supabase, utilisation du fallback:", err);
                const local = localStorage.getItem('fourni_market_products');
                products = local ? JSON.parse(local) : defaultProducts;
            }
        }

        function isDraft(prod) {
            return prod.draft === true || prod.draft === "true";
        }

        // RENDU DES CATÉGORIES
        function renderCategories() {
            const container = document.getElementById('categories-container');
            container.innerHTML = categories.map(cat => `
                <div class="cat-chip ${cat.id === activeCategory ? 'active' : ''}" onclick="filterCategory('${cat.id}')">
                    ${cat.label}
                </div>
            `).join('');

            const selectNew = document.getElementById('new-category');
            const selectEdit = document.getElementById('edit-category');
            const validCats = categories.filter(c => c.id !== 'all');
            
            const optionsHtml = validCats.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
            if (selectNew) selectNew.innerHTML = optionsHtml;
            if (selectEdit) selectEdit.innerHTML = optionsHtml;
        }

        function filterCategory(catId) {
            activeCategory = catId;
            renderCategories();
            renderProducts();
        }

        // RENDU DES PRODUITS
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            let filtered = activeCategory === 'all' 
                ? products 
                : products.filter(p => p.category === activeCategory);

            if (!isAdmin) {
                filtered = filtered.filter(p => !isDraft(p));
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">Aucun produit dans cette catégorie.</p>`;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const isProdDraft = isDraft(p);
                const imageContent = p.image 
                    ? `<img src="${p.image}" alt="${p.name}">` 
                    : `<span class="product-emoji">${p.emoji || '📦'}</span>`;

                let adminBtns = '';
                if (isAdmin) {
                    adminBtns = `
                        <div class="admin-actions">
                            <button class="admin-btn" onclick="event.stopPropagation(); openEditModal('${p.id}')">✏️</button>
                            <button class="admin-btn draft" onclick="event.stopPropagation(); toggleDraft('${p.id}')">${isProdDraft ? '👁️' : '🚫'}</button>
                            <button class="admin-btn delete" onclick="event.stopPropagation(); deleteProduct('${p.id}')">🗑️</button>
                        </div>
                    `;
                }

                return `
                    <div class="product-card ${isProdDraft ? 'draft-card' : ''}" onclick="goToProduct('${p.id}')">
                        ${adminBtns}
                        ${isProdDraft ? '<div class="draft-badge">BROUILLON</div>' : ''}
                        <div class="product-image-container">
                            ${imageContent}
                        </div>
                        <div class="product-title">${p.name}</div>
                        <div class="product-desc">${p.desc || ''}</div>
                        <div class="product-bottom">
                            <div class="product-price">${parseFloat(p.price).toFixed(2)} €</div>
                            <button class="buy-btn" onclick="event.stopPropagation(); goToProduct('${p.id}')">Voir</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function goToProduct(id) {
            window.location.href = `produit.html?id=${id}`;
        }

        // ADMIN TOGGLE
        function toggleAdminView() {
            isAdmin = !isAdmin;
            const btn = document.getElementById('admin-toggle-btn');
            const controls = document.getElementById('admin-controls');
            
            if (isAdmin) {
                btn.style.borderColor = "var(--neon-purple)";
                btn.style.color = "var(--neon-purple)";
                controls.style.display = 'flex';
            } else {
                btn.style.borderColor = "rgba(255,255,255,0.1)";
                btn.style.color = "var(--text-muted)";
                controls.style.display = 'none';
            }
            renderProducts();
        }

        // AJOUT / ÉDITION / SUPPRESSION PRODUIT
        async function handleAddProduct(e) {
            e.preventDefault();
            const title = document.getElementById('new-title').value;
            const price = parseFloat(document.getElementById('new-price').value);
            const category = document.getElementById('new-category').value;
            const sizeType = document.getElementById('new-size-type').value;
            const emojiOrUrl = document.getElementById('new-emoji').value;
            const desc = document.getElementById('new-desc').value;
            const draft = document.getElementById('new-draft').value === "true";

            let isUrl = emojiOrUrl.startsWith('http://') || emojiOrUrl.startsWith('https://');

            const newProd = {
                name: title,
                price: price,
                category: category,
                sizeType: sizeType,
                desc: desc,
                emoji: isUrl ? '' : (emojiOrUrl || '📦'),
                image: isUrl ? emojiOrUrl : '',
                draft: draft,
                suggestions: []
            };

            try {
                const { data, error } = await supabaseClient.from('products').insert([newProd]).select();
                if (error) throw error;
                if (data && data[0]) products.push(data[0]);
            } catch(err) {
                console.warn("Échec insertion Supabase, sauvegarde locale :", err);
                newProd.id = Date.now().toString();
                products.push(newProd);
                localStorage.setItem('fourni_market_products', JSON.stringify(products));
            }

            closeModal('add-modal');
            document.getElementById('add-product-form').reset();
            renderProducts();
        }

        function openEditModal(id) {
            const p = products.find(item => String(item.id) === String(id));
            if (!p) return;

            document.getElementById('edit-id').value = p.id;
            document.getElementById('edit-title').value = p.name;
            document.getElementById('edit-price').value = p.price;
            document.getElementById('edit-category').value = p.category;
            document.getElementById('edit-size-type').value = p.sizeType || 'unique';
            document.getElementById('edit-emoji').value = p.image || p.emoji || '';
            document.getElementById('edit-desc').value = p.desc || '';
            document.getElementById('edit-draft').value = isDraft(p) ? "true" : "false";

            const sugContainer = document.getElementById('edit-suggestions-list');
            const currentSug = p.suggestions || [];
            
            sugContainer.innerHTML = products
                .filter(item => String(item.id) !== String(p.id))
                .map(item => {
                    const checked = currentSug.map(String).includes(String(item.id)) ? 'checked' : '';
                    return `
                        <div style="font-size: 0.8rem; margin-bottom: 4px;">
                            <label style="display: flex; align-items: center; gap: 6px;">
                                <input type="checkbox" class="edit-sug-checkbox" value="${item.id}" ${checked}>
                                ${item.name} (${item.price} €)
                            </label>
                        </div>
                    `;
                }).join('');

            openModal('edit-modal');
        }

        async function handleEditProduct(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const title = document.getElementById('edit-title').value;
            const price = parseFloat(document.getElementById('edit-price').value);
            const category = document.getElementById('edit-category').value;
            const sizeType = document.getElementById('edit-size-type').value;
            const emojiOrUrl = document.getElementById('edit-emoji').value;
            const desc = document.getElementById('edit-desc').value;
            const draft = document.getElementById('edit-draft').value === "true";

            const selectedSuggestions = Array.from(document.querySelectorAll('.edit-sug-checkbox:checked')).map(cb => cb.value);

            let isUrl = emojiOrUrl.startsWith('http://') || emojiOrUrl.startsWith('https://');

            const updatedData = {
                name: title,
                price: price,
                category: category,
                sizeType: sizeType,
                desc: desc,
                emoji: isUrl ? '' : (emojiOrUrl || '📦'),
                image: isUrl ? emojiOrUrl : '',
                draft: draft,
                suggestions: selectedSuggestions
            };

            try {
                const { error } = await supabaseClient.from('products').update(updatedData).eq('id', id);
                if (error) throw error;
            } catch (err) {
                console.warn("Échec mise à jour Supabase, sauvegarde locale :", err);
            }

            const idx = products.findIndex(p => String(p.id) === String(id));
            if (idx !== -1) {
                products[idx] = { ...products[idx], ...updatedData };
                localStorage.setItem('fourni_market_products', JSON.stringify(products));
            }

            closeModal('edit-modal');
            renderProducts();
        }

        async function toggleDraft(id) {
            const p = products.find(item => String(item.id) === String(id));
            if (!p) return;
            const newDraftState = !isDraft(p);

            try {
                await supabaseClient.from('products').update({ draft: newDraftState }).eq('id', id);
            } catch(e) {}

            p.draft = newDraftState;
            localStorage.setItem('fourni_market_products', JSON.stringify(products));
            renderProducts();
        }

        async function deleteProduct(id) {
            if (!confirm("Voulez-vous vraiment supprimer ce produit ?")) return;

            try {
                await supabaseClient.from('products').delete().eq('id', id);
            } catch (e) {}

            products = products.filter(p => String(p.id) !== String(id));
            localStorage.setItem('fourni_market_products', JSON.stringify(products));
            renderProducts();
        }

        // GESTION DES CATÉGORIES
        async function addCategory() {
            const label = document.getElementById('new-cat-label').value.trim();
            if (!label) return;

            const id = label.toLowerCase().replace(/[^a-z0-9]/g, '-');
            const newCat = { id, label };

            try {
                await supabaseClient.from('categories').insert([newCat]);
            } catch (e) {}

            categories.push(newCat);
            localStorage.setItem('fourni_market_categories', JSON.stringify(categories.filter(c => c.id !== 'all')));
            
            document.getElementById('new-cat-label').value = '';
            renderCategories();
            renderManageCategories();
        }

        function renderManageCategories() {
            const container = document.getElementById('cat-list-manage');
            const editableCats = categories.filter(c => c.id !== 'all');

            container.innerHTML = editableCats.map(c => `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
                    <span>${c.label}</span>
                    <button class="admin-btn delete" onclick="deleteCategory('${c.id}')">Supprimer</button>
                </div>
            `).join('');
        }

        async function deleteCategory(id) {
            if (!confirm("Supprimer cette catégorie ?")) return;

            try {
                await supabaseClient.from('categories').delete().eq('id', id);
            } catch (e) {}

            categories = categories.filter(c => c.id !== id);
            localStorage.setItem('fourni_market_categories', JSON.stringify(categories.filter(c => c.id !== 'all')));
            
            renderCategories();
            renderManageCategories();
        }

        // GESTION DU PANIER
        function loadCart() {
            const localCart = localStorage.getItem('fourni_market_cart');
            cart = localCart ? JSON.parse(localCart) : [];
        }

        function saveCart() {
            localStorage.setItem('fourni_market_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function addToCart(productId) {
            const product = products.find(p => String(p.id) === String(productId));
            if (!product) return;

            let defaultSize = 'Taille unique';
            let effectiveSizeType = product.sizeType;
            if (!effectiveSizeType) {
                if (product.category === 'chaussures') effectiveSizeType = 'num_36_46';
                else if (product.category === 'vetements' || product.category === 'maillots-de-foot') effectiveSizeType = 'xs_xl';
            }

            if (effectiveSizeType === 'num_36_46') defaultSize = '39';
            else if (effectiveSizeType === 'xs_xl') defaultSize = 'M';

            const existing = cart.find(item => String(item.id) === String(productId) && item.size === defaultSize);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ id: productId, size: defaultSize, qty: 1 });
            }
            saveCart();
        }

        function updateQty(index, change) {
            cart[index].qty += change;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            saveCart();
            renderCartModal();
        }

        function updateCartUI() {
            const bar = document.getElementById('cart-bar');
            const countEl = document.getElementById('cart-count');
            const totalEl = document.getElementById('cart-total');

            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            
            if (totalItems === 0) {
                bar.style.display = 'none';
                return;
            }

            bar.style.display = 'flex';
            countEl.textContent = totalItems;

            let totalPrice = 0;
            cart.forEach(item => {
                const p = products.find(prod => String(prod.id) === String(item.id));
                if (p) totalPrice += parseFloat(p.price) * item.qty;
            });

            totalEl.textContent = `${totalPrice.toFixed(2)} €`;
        }

        function renderCartModal() {
            const container = document.getElementById('cart-items-container');
            const totalModal = document.getElementById('modal-cart-total');

            if (cart.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 1rem;">Votre panier est vide.</p>`;
                totalModal.textContent = "0.00 €";
                return;
            }

            let totalPrice = 0;
            container.innerHTML = cart.map((item, idx) => {
                const p = products.find(prod => String(prod.id) === String(item.id));
                if (!p) return '';
                const itemTotal = parseFloat(p.price) * item.qty;
                totalPrice += itemTotal;

                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <span class="cart-item-title">${p.name}</span>
                            <span class="cart-item-sub">Taille: ${item.size} | ${parseFloat(p.price).toFixed(2)} €</span>
                        </div>
                        <div class="cart-item-controls">
                            <button class="qty-btn" onclick="updateQty(${idx}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty(${idx}, 1)">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalModal.textContent = `${totalPrice.toFixed(2)} €`;
        }

        // ENVOI COMMANDE TELEGRAM
        function sendOrderTelegram() {
            if (cart.length === 0) return;

            const name = document.getElementById('cust-name').value.trim();
            const address = document.getElementById('cust-address').value.trim();

            if (!name) {
                alert("Veuillez renseigner votre Nom ou Pseudo Telegram.");
                return;
            }

            let message = `🛍️ **NOUVELLE COMMANDE**\n\n`;
            message += `👤 **Client:** ${name}\n`;
            if (address) message += `📍 **Infos/Adresse:** ${address}\n`;
            message += `\n📦 **Articles:**\n`;

            let total = 0;
            cart.forEach(item => {
                const p = products.find(prod => String(prod.id) === String(item.id));
                if (p) {
                    const sub = parseFloat(p.price) * item.qty;
                    total += sub;
                    message += `- ${p.name} (Taille: ${item.size}) x${item.qty} : ${sub.toFixed(2)}€\n`;
                }
            });

            message += `\n💰 **TOTAL:** ${total.toFixed(2)} €`;

            const encodedMessage = encodeURIComponent(message);
            const tgUrl = `https://t.me/${TELEGRAM_USERNAME}?text=${encodedMessage}`;

            window.open(tgUrl, '_blank');
        }

        // MODALS HELPERS
        function openModal(id) {
            if (id === 'cart-modal') renderCartModal();
            if (id === 'cat-modal') renderManageCategories();
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // FERMER MODAL EN CLIQUANT A L'EXTÉRIEUR
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }

        // DÉMARRAGE
        init();
    </script>
</body>
</html>
